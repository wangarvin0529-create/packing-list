<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>外出與出國物品檢查表</title>
    <style>
        :root {
            --primary: #4A90E2;
            --success: #2ECC71;
            --danger: #E74C3C;
            --bg: #F4F7F6;
            --card: #FFFFFF;
            --text: #333333;
            --muted: #888888;
            --border: #E5E7EB;
            --tab-bg: #EAECEF;
            --tab-text: #555555;
            --btn-subtle: #F8F9FA;
            --shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        body.dark-mode {
            --primary: #5AA2F0;
            --success: #34D399;
            --danger: #F87171;
            --bg: #12151C;
            --card: #1E2430;
            --text: #F1F5F9;
            --muted: #94A3B8;
            --border: #2D3748;
            --tab-bg: #2A3242;
            --tab-text: #CBD5E1;
            --btn-subtle: #262E3D;
            --shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            box-shadow: var(--shadow);
            transition: background-color 0.25s ease, box-shadow 0.25s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--text);
        }

        .theme-btn {
            padding: 7px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--btn-subtle);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s ease;
        }

        .theme-btn:hover {
            opacity: 0.9;
        }

        /* 情境切換按鈕 */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            background: var(--tab-bg);
            color: var(--tab-text);
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #FFFFFF;
        }

        /* 進度條 */
        .progress-wrapper {
            margin-bottom: 18px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            margin-bottom: 6px;
            color: var(--muted);
        }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: var(--tab-bg);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* 新增輸入框 */
        .add-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.25s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        .add-btn {
            padding: 0 18px;
            background: var(--primary);
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .add-btn:hover {
            opacity: 0.92;
        }

        /* 清單項目 */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 8px;
            border-bottom: 1px solid var(--border);
            transition: 0.2s ease;
        }

        li:last-child {
            border-bottom: none;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            cursor: pointer;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--success);
            cursor: pointer;
        }

        .item-text {
            font-size: 1.02rem;
            transition: 0.2s ease;
        }

        .checked .item-text {
            text-decoration: line-through;
            color: var(--muted);
        }

        .del-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.15rem;
            cursor: pointer;
            padding: 4px 8px;
            opacity: 0.65;
            transition: opacity 0.2s ease;
        }

        .del-btn:hover {
            opacity: 1;
        }

        /* 底部操作區 */
        .footer-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 11px;
            background: var(--btn-subtle);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--tab-text);
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .action-btn:hover {
            opacity: 0.88;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>✈️ 外出與出國物品檢查表</h1>
        <button class="theme-btn" id="theme-toggle" onclick="toggleTheme()">🌙 深色</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-daily" onclick="switchTab('daily')">日常出門</button>
        <button class="tab-btn" id="tab-abroad" onclick="switchTab('abroad')">出國必備</button>
    </div>

    <div class="progress-wrapper">
        <div class="progress-text">
            <span id="status-label">準備進度</span>
            <span id="progress-count">0 / 0</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>

    <div class="add-group">
        <input type="text" id="new-item-input" placeholder="輸入要帶的物品..." onkeypress="handleKeyPress(event)">
        <button class="add-btn" onclick="addItem()">新增</button>
    </div>

    <ul id="checklist"></ul>

    <div class="footer-actions">
        <button class="action-btn" onclick="resetChecks()">🔄 取消勾選</button>
        <button class="action-btn" onclick="restoreDefault()">📋 恢復預設清單</button>
    </div>
</div>

<script>
    const STORAGE_KEY = 'packingApp_v2';
    const THEME_KEY = 'packingApp_theme_v1';

    const defaultData = {
        daily: [
            { text: "手機", checked: false },
            { text: "錢包 / 證件", checked: false },
            { text: "鑰匙", checked: false },
            { text: "行動電源 & 充電線", checked: false },
            { text: "面紙 / 濕紙巾", checked: false }
        ],
        abroad: [
            { text: "護照（效期需滿 6 個月以上）", checked: false },
            { text: "機票 / 飯店住宿憑證", checked: false },
            { text: "外幣現金 & 海外可用信用卡", checked: false },
            { text: "SIM 卡 / eSIM / 國際漫遊設定", checked: false },
            { text: "行動電源 & 充電線", checked: false },
            { text: "萬國插頭 / 當地轉接頭", checked: false },
            { text: "個人常備藥品", checked: false },
            { text: "換洗衣物 / 睡衣 / 襪子", checked: false },
            { text: "盥洗用品（牙刷、洗面乳、保養品）", checked: false },
            { text: "折疊傘 / 隨身小包", checked: false }
        ]
    };

    let currentTab = 'abroad';
    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || JSON.parse(JSON.stringify(defaultData));

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function applyTheme(isDark) {
        document.body.classList.toggle('dark-mode', isDark);
        const btn = document.getElementById('theme-toggle');
        btn.innerText = isDark ? '☀️ 淺色' : '🌙 深色';
    }

    function toggleTheme() {
        const isDark = !document.body.classList.contains('dark-mode');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        applyTheme(isDark);
    }

    function initTheme() {
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme === 'dark') {
            applyTheme(true);
        } else if (savedTheme === 'light') {
            applyTheme(false);
        } else {
            const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(prefersDark);
        }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tab-daily').classList.toggle('active', tab === 'daily');
        document.getElementById('tab-abroad').classList.toggle('active', tab === 'abroad');
        render();
    }

    function render() {
        const listEl = document.getElementById('checklist');
        listEl.innerHTML = '';
        const items = appData[currentTab] || [];

        items.forEach((item, index) => {
            const li = document.createElement('li');
            if (item.checked) li.classList.add('checked');

            li.innerHTML = `
                <div class="item-left" onclick="toggleItem(${index})">
                    <input type="checkbox" ${item.checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleItem(${index})">
                    <span class="item-text">${escapeHtml(item.text)}</span>
                </div>
                <button class="del-btn" onclick="deleteItem(${index})" title="刪除">✕</button>
            `;
            listEl.appendChild(li);
        });

        updateProgress();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    function toggleItem(index) {
        appData[currentTab][index].checked = !appData[currentTab][index].checked;
        saveData();
        render();
    }

    function addItem() {
        const input = document.getElementById('new-item-input');
        const text = input.value.trim();
        if (!text) return;
        appData[currentTab].push({ text: text, checked: false });
        input.value = '';
        saveData();
        render();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') addItem();
    }

    function deleteItem(index) {
        appData[currentTab].splice(index, 1);
        saveData();
        render();
    }

    function resetChecks() {
        appData[currentTab].forEach(item => item.checked = false);
        saveData();
        render();
    }

    function restoreDefault() {
        const confirmed = confirm('要將目前分頁的清單恢復為預設物品嗎？你自行新增或刪除的項目會被取代。');
        if (!confirmed) return;
        appData[currentTab] = JSON.parse(JSON.stringify(defaultData[currentTab]));
        saveData();
        render();
    }

    function updateProgress() {
        const items = appData[currentTab] || [];
        const total = items.length;
        const checkedCount = items.filter(i => i.checked).length;
        const percent = total === 0 ? 0 : Math.round((checkedCount / total) * 100);

        document.getElementById('progress-count').innerText = `${checkedCount} / ${total}`;
        document.getElementById('progress-fill').style.width = `${percent}%`;

        const statusLabel = document.getElementById('status-label');
        if (total > 0 && checkedCount === total) {
            statusLabel.innerText = "🎉 全部檢查完畢，可以出發囉！";
            statusLabel.style.color = "var(--success)";
            statusLabel.style.fontWeight = "bold";
        } else {
            statusLabel.innerText = "準備進度";
            statusLabel.style.color = "var(--muted)";
            statusLabel.style.fontWeight = "normal";
        }
    }

    initTheme();
    switchTab(currentTab);
</script>

</body>
</html>
